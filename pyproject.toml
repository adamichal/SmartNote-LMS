[tool.ruff]
# README says Python 3.11+, so lint against the oldest supported version
target-version = "py311"

[tool.ruff.lint]
# errors, unused imports/variables, import sorting
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# scripts add the project root to sys.path before importing backend
"scripts/*" = ["E402"]
